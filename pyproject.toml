[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-market"
version = "0.2.0"
description = "Attention Market Intelligence — measure how attention transforms into engagement, behavior, market activity, value and risk. v0.2 introduces asset type abstraction (MEME / Stablecoin / L1 / DeFi / Security / Unknown) with profile-driven risk and gate configuration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "attention-market contributors" }]
keywords = [
    "attention", "attention-economy", "market-intelligence", "onchain",
    "meme", "stablecoin", "defi", "l1", "analytics", "risk",
    "universal-asset-model", "ufam",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
attention-market = "attention_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"attention_market" = ["../config/*.yaml"]
